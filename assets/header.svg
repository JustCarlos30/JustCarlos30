<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Carlos Jarero — Vol. 1</title>
  <desc id="description">An original release sleeve: oversized bone-white type with red print misregistration, purple and blood-red smoke, film grain, and a tall, torn-sheet ghost cropped by the top edge. An angled EXPLICIT CODE sticker sits at the bottom right.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="420" />
    </clipPath>
    <filter id="smoke" x="-40%" y="-60%" width="180%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .018" numOctaves="3" seed="18" result="haze" />
      <feDisplacementMap in="SourceGraphic" in2="haze" scale="100" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="27" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".79" numOctaves="3" seed="30" />
      <feColorMatrix type="matrix" values="0 0 0 0 .82  0 0 0 0 .78  0 0 0 0 .71  0 0 0 .32 0" />
    </filter>
    <filter id="torn-edge" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="9" result="paper" />
      <feDisplacementMap in="SourceGraphic" in2="paper" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#0b0a0d" />

    <!-- Diffuse ink clouds, without reflective or glossy surfaces. -->
    <g filter="url(#smoke)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -16 7; 0 0" dur="28s" repeatCount="indefinite" />
      <path d="M390 280 C520 90 630 315 768 102 S1050 30 1190 113" fill="none" stroke="#4b1d6b" stroke-width="145" />
      <path d="M690 435 C790 285 945 380 1020 229 S1185 154 1280 205" fill="none" stroke="#8a1414" stroke-width="105" />
      <path d="M720 214 C867 70 976 266 1175 15" fill="none" stroke="#4b1d6b" stroke-width="45" />
    </g>

    <!-- An elongated, asymmetrical sheet: no limbs, spikes, or round torso. -->
    <g filter="url(#torn-edge)">
      <path d="M930-52 C1018-75 1091-19 1099 60 L1110 143 1126 228 1153 302 1118 278 1131 364 1095 328 1101 405 1075 374 1061 444 1042 424 1032 336 1012 372 1009 296 980 330 987 254 960 277 967 196 942 230 950 139 C929 81 905 18 930-52Z" fill="#b6afa4" />
      <path d="M964-18 L989 46 979 136 994 192 974 241 987 153 966 103Z M1068 64 L1055 177 1080 284 1061 232 1044 174Z M1026 223 L1042 292 1032 336 1032 285Z" fill="#0b0a0d" opacity=".6" />
      <path d="M972 83 L1008 103 997 121 976 114Z M1038 97 L1070 72 1063 107 1040 119Z" fill="#0b0a0d" />
      <path d="M1018 140 L1028 135 1024 181 1015 193Z" fill="#0b0a0d" />
      <path d="M1097 211 L1105 254 M1000 23 L1010 60 M1057 307 L1065 337" stroke="#ece6da" stroke-width="2" opacity=".35" />
    </g>

    <!-- The red impression sits a few pixels out of register. -->
    <g font-family="Impact, 'Arial Narrow Bold', 'Helvetica Neue Condensed', sans-serif" font-size="171" font-weight="900" letter-spacing="-5">
      <g fill="#8a1414" transform="translate(5 3)" aria-hidden="true">
        <text x="43" y="181" textLength="698" lengthAdjust="spacingAndGlyphs">CARLOS</text>
        <text x="40" y="332" textLength="806" lengthAdjust="spacingAndGlyphs">JARERO</text>
      </g>
      <g fill="#ece6da">
        <text x="43" y="181" textLength="698" lengthAdjust="spacingAndGlyphs">CARLOS</text>
        <text x="40" y="332" textLength="806" lengthAdjust="spacingAndGlyphs">JARERO</text>
      </g>
    </g>

    <!-- Dry printing scratches cross the letterforms. -->
    <g fill="none" stroke="#0b0a0d" opacity=".48">
      <path d="M45 147 L334 145 M442 103 L707 105 M150 276 L505 273 M588 302 L825 299" stroke-width="1.5" />
      <path d="M254 58 L247 175 M672 216 L669 328" stroke-width="1" />
    </g>
    <path d="M46 361 H843" stroke="#ece6da" stroke-opacity=".4" />
    <text x="47" y="389" fill="#ece6da" font-family="monospace" font-size="13" letter-spacing="1">VOL. 1 — SOFTWARE ENGINEER — MX</text>

    <!-- One continuous line of type and a cut corner, not a certification seal. -->
    <g transform="translate(936 352) rotate(-5)">
      <path d="M0 0 H205 L222 17 V52 H0Z" fill="#ece6da" />
      <path d="M9 9 V43 M15 9 V43" stroke="#8a1414" stroke-width="3" />
      <text x="27" y="33" fill="#0b0a0d" font-family="Impact, 'Arial Narrow Bold', 'Helvetica Neue Condensed', sans-serif" font-size="23" textLength="180" lengthAdjust="spacingAndGlyphs">EXPLICIT CODE</text>
    </g>
    <rect width="1200" height="420" filter="url(#grain)" opacity=".33" pointer-events="none" />
  </g>
</svg>
